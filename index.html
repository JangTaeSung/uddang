<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uddang 혈관도</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Uddang 혈관도</h1>
      <p>화면 왼쪽이 오른팔, 오른쪽이 왼팔입니다. 위쪽이 요골(엄지) 쪽입니다.</p>
    </div>
    <div class="tools">
      <button type="button" id="mode-path" class="mode-btn active">경로 편집</button>
      <button type="button" id="mode-marker" class="mode-btn">표식</button>
      <select id="marker-type" disabled>
        <option value="borderline">보더라인</option>
        <option value="thrombosis">혈전 (Th)</option>
        <option value="bend">굽힘</option>
        <option value="branch">분지 (Br)</option>
      </select>
      <button type="button" id="undo" disabled>되돌리기</button>
      <button type="button" id="redo" disabled>다시 실행</button>
    </div>
    <div class="export-tools">
      <label class="file-btn">윤곽 이미지
        <input id="bg-file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
      </label>
      <button type="button" id="clear-bg">기본 윤곽</button>
      <button type="button" id="export-png">PNG</button>
      <button type="button" id="export-svg">SVG</button>
    </div>
  </header>
  <main>
    <aside>
      <div id="vessel-list"></div>
      <div class="legend">
        <span><i class="dot" style="background:#c0392b"></i>동맥</span>
        <span><i class="dot" style="background:#2e86c1"></i>정맥</span>
        <span><i class="dot" style="background:#c62828"></i>Considerable</span>
        <span><i class="dot" style="background:#00acc1"></i>Borderline</span>
      </div>
    </aside>
    <div class="stage">
      <svg id="map" viewBox="0 0 583 419" role="img" aria-label="상지 혈관 도식">
        <rect width="583" height="419" fill="#ffffff"></rect>
        <image id="bg-image" href="assets/body-outline.png" x="0" y="0" width="583" height="419"></image>
        <g id="vessels"></g>
        <g id="labels"></g>
        <g id="markers"></g>
        <g id="handles"></g>
      </svg>
    </div>
    <section class="inspector">
      <h2 id="inspect-title" style="margin:0 0 8px;font-size:16px">혈관을 선택하세요</h2>
      <p class="hint" id="inspect-hint">목록 또는 도식에서 혈관을 고르면 굵기, 색, 굽힘을 바꿀 수 있습니다.</p>
      <div id="vessel-fields" hidden>
        <label class="field"><span>이름</span><input id="field-name" type="text"></label>
        <label class="field"><span>직경 (mm)</span><input id="field-diameter" type="number" min="0.4" max="40" step="0.1"></label>
        <label class="field"><span>색</span><input id="field-color" type="color"></label>
        <label class="field"><span>구간 스타일</span>
          <select id="field-style">
            <option value="normal">보통</option>
            <option value="considerable">Considerable</option>
            <option value="borderline">Borderline</option>
          </select>
        </label>
        <label class="row"><input id="field-visible" type="checkbox"> 표시</label>
        <div class="tools" style="margin-top:10px">
          <button type="button" id="add-point">점 추가</button>
          <button type="button" id="delete-point">점 삭제</button>
          <button type="button" id="reset-vessel">이 혈관 초기화</button>
        </div>
      </div>
      <div id="marker-fields" hidden>
        <label class="field"><span>메모</span><textarea id="field-note" rows="3"></textarea></label>
        <button type="button" id="delete-marker">표식 삭제</button>
      </div>
      <div class="tools" style="margin-top:16px">
        <button type="button" id="reset-all">전체 초기화</button>
      </div>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
